name: Deploy Pages

on:
  push:
    branches: [main]
    # odds-data / odds-archive の更新だけではデプロイしない（毎分のビルド渋滞を防ぐ）
    paths-ignore:
      - 'odds-data/**'
      - 'odds-archive/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 新しいデプロイが来たら、古い実行を取り消して最新だけを公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
